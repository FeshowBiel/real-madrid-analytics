name: ETL Real Madrid

on:
  schedule:
    - cron: '0 9 * * 1'      # 06h BRT, toda segunda (pos-rodada)
    - cron: '0 9 * * 4'      # 06h BRT, toda quinta (pos-Champions)
  workflow_dispatch:          # botão manual

permissions:
  contents: write

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Rodar ETL
        run: python src/etl.py

      - name: Commitar dados atualizados
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/real_madrid.db
          git diff --staged --quiet || git commit -m "chore: atualiza base $(date -u +'%Y-%m-%d')"
          git push
